name: Mauritius news

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub actually starts it every ~25 min; each run checks 5 times
  workflow_dispatch:          # "Run workflow" button for a manual run
    inputs:
      test:
        description: "Test only: check translation and summary, post nothing"
        type: boolean
        default: false
      compare:
        description: "Compare all models on the newest articles, post nothing"
        type: boolean
        default: false
      dupeval:
        description: "Evaluate duplicate detection on real articles, post nothing"
        type: boolean
        default: false
      probe:
        description: "Check which news sites are reachable (probe.py), post nothing"
        type: boolean
        default: false

permissions:
  contents: write             # to save the bot's state to the "state" branch

concurrency:
  # test/compare/probe runs don't touch the bot's state, so they don't wait
  group: ${{ (inputs.test || inputs.compare || inputs.probe || inputs.dupeval) && 'news-test' || 'news' }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The bot's memory (seen.json, recent.json, state.json, logs) lives in
      # the separate "state" branch, so main only has code changes.
      - uses: actions/checkout@v4
        with:
          ref: state
          path: state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser requests deep-translator trafilatura

      - name: Run bot
        shell: bash
        run: |
          set -o pipefail
          set +e  # errors are handled explicitly below; a missing file must not stop the bot
          git -C state config user.name "news-bot"
          git -C state config user.email "news-bot@users.noreply.github.com"
          # Save the bot's state to the "state" branch. Only this job writes
          # there, so our copy always wins a conflict.
          save_state() {
            ( cd state
              files=$(ls $1 2>/dev/null)   # only files that exist
              git add $files 2>/dev/null
              git diff --cached --quiet && exit 0
              git commit -q -m "update state"
              for try in 1 2 3; do
                if git pull --rebase -q -X theirs origin state && git push -q origin HEAD:state; then exit 0; fi
                git rebase --abort 2>/dev/null
                mkdir -p /tmp/keep && cp $files /tmp/keep/ 2>/dev/null
                git fetch -q origin state && git reset -q --hard origin/state
                cp /tmp/keep/* . 2>/dev/null
                git add $files 2>/dev/null
                git diff --cached --quiet || git commit -q -m "update state"
                git push -q origin HEAD:state && exit 0
                sleep 5
              done
              echo "WARNING: could not save state" | tee -a last_run.log
              exit 1 )
          }
          # Test modes write their own log and never touch the bot's state
          if [ "${{ inputs.probe }}" = "true" ]; then BOT_TEST=1 python probe.py 2>&1 | tee state/test_run.log; save_state test_run.log; exit 0; fi
          if [ "${{ inputs.dupeval }}" = "true" ]; then BOT_TEST=1 python bot.py --dupeval 2>&1 | tee state/test_run.log; save_state test_run.log; exit 0; fi
          if [ "${{ inputs.test }}" = "true" ] || [ "${{ inputs.compare }}" = "true" ]; then
            BOT_TEST=1 python bot.py ${{ inputs.test && '--test' || '' }} ${{ inputs.compare && '--compare' || '' }} 2>&1 | tee state/test_run.log || true
            git -C state checkout -- seen.json recent.json state.json 2>/dev/null || true
            save_state test_run.log; exit 0
          fi
          # GitHub starts scheduled runs only every ~25 minutes, so each run
          # checks the news several times, 4 minutes apart.
          LOOPS=1; [ "${{ github.event_name }}" = "schedule" ] && LOOPS=5
          : > state/last_run.log
          START=$(date +%s)
          for i in $(seq 1 $LOOPS); do
            echo "### check $i/$LOOPS at $(TZ=Indian/Mauritius date +%H:%M)" | tee -a state/last_run.log
            python bot.py 2>&1 | tee -a state/last_run.log || true
            save_state "last_run.log seen.json recent.json state.json"
            # next check 4 minutes after this one started (posting can take a while)
            if [ $i -lt $LOOPS ]; then left=$(( START + i*240 - $(date +%s) )); [ $left -gt 0 ] && sleep $left; fi
          done
        env:
          STATE_DIR: state
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          PYTHONUNBUFFERED: "1"
