name: Mauritius news

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # "Run workflow" button for a manual run
    inputs:
      test:
        description: "Test only: check translation and summary, post nothing"
        type: boolean
        default: false

permissions:
  contents: write             # to save seen.json back to the repo

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser requests deep-translator trafilatura

      - name: Run bot
        shell: bash
        run: |
          set -o pipefail
          python bot.py ${{ inputs.test && '--test' || '' }} 2>&1 | tee last_run.log
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          PYTHONUNBUFFERED: "1"

      - name: Save seen.json, state.json and last_run.log
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add last_run.log $(ls seen.json state.json 2>/dev/null)
          git diff --cached --quiet || git commit -m "update seen"
          git pull --rebase -q || true
          git push
